<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fontconfig for scripts/make-og.mjs: the fonts in this folder and no others,
  so the social preview images look the same on every machine. No system
  folders and no system settings are included.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">doughnutforge-build-fonts</cachedir>
</fontconfig>
