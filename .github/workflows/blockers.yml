# Content blockers on phones: once a day, builds the site and runs every public
# list phone browsers use against every page, as an iPhone and as an Android
# phone (npm run test:blockers, tests/blockers/). The lists change daily, so a
# new rule that would hide or block part of the site fails this run, and GitHub
# emails the owner. Kept apart from the deploy, so a list change can never stop
# a fix from going out. The site itself never contacts these lists.
name: Content blockers

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - run: npm run test:blockers
