# Content blockers on phones: on every push to main, once a day and by hand,
# builds the site and runs every public list phone browsers use against every
# page, as an iPhone and as an Android phone (npm run test:blockers,
# tests/blockers/). The lists change daily, so a new rule that would hide or
# block part of the site fails this run, and GitHub emails the owner. Kept apart
# from the deploy, in its own workflow and queue, so it never delays a deploy
# and a list change can never stop a fix from going out. The push run is there
# because GitHub's schedule is best effort (on 25 October 2026 it ran five hours
# late; on 26 October not at all by 10:52 UTC). The site itself never contacts
# these lists.
name: Content blockers

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

# One run at a time; a newer push replaces a run still going for an older one
concurrency:
  group: blockers
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - run: npm run test:blockers
