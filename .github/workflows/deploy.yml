# Builds the site and publishes it to GitHub Pages on every push to main, once a
# day (so newly answered issues appear), and on demand. The deploy fails, and the live site stays as it was, if any check in
# `npm run build:deploy` fails or Pages no longer deploys from Actions. The run
# also fails, after the deploy, if the live / and /download/ are not the pages it
# built, the live security.txt or build.json is not the one it built, or the live
# apple-app-site-association is missing. Before deploying, it stops if the
# uploaded archive leaves out any built file (dotfiles included), and unless
# private vulnerability reporting is on in forge-privacy, where /security/ and
# security.txt send reports.
# The build reads this repository, plus one step: "Fetch answered issues" reads
# forge-privacy's public issues with no token (scripts/fetch-issues.mjs), and if
# that fails the build uses the committed src/data/issues.json. Store badges, app
# strings and the privacy policy are committed copies, and no step calls a store.
# The fonts for the social preview images are committed in build-fonts/
# (scripts/og-fonts.mjs), so no step downloads fonts: on 26 October 2026 the apt
# download of the CJK fonts stalled three times and failed the deploy.
name: Deploy site

on:
  push:
    branches: [main]
  # Daily, for the answered issues (GitHub turns this off after 60 days with no
  # activity in the repo; turn it back on under Actions)
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      home: ${{ steps.hashes.outputs.home }}
      download: ${{ steps.hashes.outputs.download }}
      security: ${{ steps.hashes.outputs.security }}
      build: ${{ steps.hashes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The issues the owner has labelled for the site. Public, so no token; on any
      # failure it keeps the committed data and the build goes on.
      - name: Fetch answered issues
        run: node scripts/fetch-issues.mjs
      - run: npm run build:deploy
      # What the live pages must match after the deploy (scripts/check-live-deploy.mjs)
      - id: hashes
        name: Record the built pages
        run: |
          echo "home=$(sha256sum dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "download=$(sha256sum dist/download/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "security=$(sha256sum dist/.well-known/security.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "build=$(sha256sum dist/build.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the upload drops every file or folder whose name starts
          # with a dot, including .well-known/apple-app-site-association, which
          # the Mac and iOS apps need for password-manager linking, and .nojekyll
          include-hidden-files: true
      # The archive just uploaded (upload-pages-artifact packs it as
      # $RUNNER_TEMP/artifact.tar) must hold every built file, dotfiles included.
      # If the archive is missing or short, this job fails and nothing is deployed.
      - name: Check the uploaded archive holds every built file
        run: node scripts/check-artifact.mjs --tar "$RUNNER_TEMP/artifact.tar" --dist dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A branch deploy would serve the repo root, where index.html is still the
      # old "Coming soon" placeholder: stop unless Pages deploys from Actions.
      # Uses the workflow token's pages permission (top of this file).
      - name: Check Pages deploys from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api repos/${{ github.repository }}/pages --jq .build_type)
          echo "Pages build_type: $source"
          test "$source" = "workflow"
      # /security/ and security.txt send reports to forge-privacy's private
      # vulnerability reporting: never deploy while it is off and the link leads nowhere
      - name: Check private vulnerability reporting is on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api repos/Darren-Corbett/forge-privacy/private-vulnerability-reporting --jq .enabled)
          echo "Private vulnerability reporting: $enabled"
          test "$enabled" = "true"
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/check-live-deploy.mjs
          sparse-checkout-cone-mode: false
      # The live /, /download/, security.txt and build.json (the build ID open tabs
      # compare with, src/components/FreshCheck.astro) must be the files this run built
      - name: Check the live pages are this build
        run: node scripts/check-live-deploy.mjs --base https://doughnut-forge.app --expect "/=${{ needs.build.outputs.home }},/download/=${{ needs.build.outputs.download }},/.well-known/security.txt=${{ needs.build.outputs.security }},/build.json=${{ needs.build.outputs.build }}"
      # The live site must serve the apps' association file: fail the run if not
      - name: Check apple-app-site-association is live
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://doughnut-forge.app/.well-known/apple-app-site-association -o aasa.json; then break; fi
            sleep 20
          done
          grep -q "J74UEFCGU7.com.darrencorbett.doughnutforge\"" aasa.json
          grep -q "J74UEFCGU7.com.darrencorbett.doughnutforge.mobile" aasa.json
          echo "apple-app-site-association is live"
